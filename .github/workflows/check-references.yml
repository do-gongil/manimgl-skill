name: check-references

on:
  push:
    branches: [main]  # branch pushes are covered by pull_request; avoids duplicate runs
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: catch a new manimgl release that renames an API

jobs:
  check:
    # manimpango ships no Linux wheels; Windows installs from wheels only
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install manimgl audioop-lts "setuptools<81"
      - run: python scripts/check_references.py
